# Уровень логирования
logLevel = "debug"

# Предзагрузка отладочных модулей
# preload = ["./debug-setup.ts"]

# Режим экономии памяти (полезно для отладки утечек)
# smol = true

[run]
# Не подавлять вывод команд
silent = false

[test]
# Ключ `coverage` здесь намеренно ОТСУТСТВУЕТ, а не выставлен в false.
#
# Покрытие не собирается в обычном прогоне: инструментация bun при загрузке
# большого графа модулей (packages/core/src/application/application.ts) с
# вероятностью ~40% уводит процесс в бесконечный цикл на главном потоке —
# таймеры умирают, вывода нет, помогает только SIGKILL.
#
# `coverage = false` НЕЛЬЗЯ: он перебивает CLI-флаг, и `bun test --coverage`
# молча перестаёт собирать данные — ни таблицы, ни lcov, при нулевом коде
# возврата. CI (.github/workflows/publish.yml) шлёт lcov в Codecov именно этим
# флагом, так что бейдж сломался бы незаметно. Проверено: ключ отсутствует —
# флаг работает; `false` — не работает.
#
# Собирать покрытие: bun run test:coverage

name: CI & Publish

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:  # Или вручную через UI

permissions:
  id-token: write  # Required for npm OIDC trusted publishing
  contents: write  # Required for git tags

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Via the script, not `bunx tsc` directly: the script also compiles each example
      # against its own tsconfig. The examples augment the same global OneBunAppConfig,
      # so they cannot share one program — and for eight months the root `include` said
      # `example/**/*` against a directory named `examples/`, which typechecked nothing.
      - name: Type check
        run: bun run typecheck

      # --max-warnings=0 because the Definition of Done asks for "no errors AND no
      # warnings"; without the flag eslint exits 0 on warnings and half the gate is void.
      - name: Lint
        run: bunx eslint packages/ --max-warnings=0

      - name: Docs cross-reference
        run: bun run docs:xref --check

      # Compiles every TypeScript fence in docs/ against the real packages. Nothing else
      # in the repo type-checks documentation, which is how a page could import a removed
      # export or name an option that does not exist and stay green for months.
      - name: Docs snippets
        run: bun run docs:typecheck --check

      # README.md is generated from docs regions plus package.json. This fails when the
      # committed file no longer matches, which is what kept its example and its version
      # column drifting away from everything else.
      - name: README up to date
        run: bun run readme:check

      - name: Pre-pull testcontainer images
        run: docker pull redis:7-alpine & docker pull nats:2.10-alpine & docker pull postgres:16-alpine & wait

      - name: Test with coverage
        timeout-minutes: 25
        env:
          TESTCONTAINERS_RYUK_DISABLED: 'true'
        # Coverage is collected here and nowhere else — `bunfig.toml` deliberately omits the
        # `coverage` key, because setting it to `false` would silently override this flag and
        # produce no lcov at all.
        #
        # Bun's coverage instrumentation intermittently spins the process forever while
        # loading a large module graph: no output, every timer in the process dead, and
        # SIGTERM is not serviced — hence `timeout -s KILL`, which reports 137. Measured at
        # roughly 4 hangs in 9 runs locally, so a single attempt is not dependable. A real
        # test failure exits non-137 and is NOT retried, so retrying cannot mask a red suite.
        run: |
          set -u
          for attempt in 1 2 3 4; do
            echo "::group::coverage attempt ${attempt}"
            set +e
            timeout -s KILL 600 bun test \
              --reporter=default --reporter=junit --reporter-outfile=test-results.xml \
              --coverage --coverage-reporter=lcov
            rc=$?
            set -e
            echo "::endgroup::"

            if [ "${rc}" -eq 0 ]; then
              exit 0
            fi

            if [ "${rc}" -ne 137 ]; then
              echo "Tests failed with exit ${rc} — a real failure, not a hang. Not retrying."
              exit "${rc}"
            fi

            echo "Attempt ${attempt} hung and was killed; retrying."
          done

          echo "The coverage run hung on every attempt."
          exit 1

      - name: Extract test count for badge
        if: github.ref == 'refs/heads/master'
        run: |
          # Parse test count from JUnit XML
          TESTS=$(grep -oP 'tests="\K[0-9]+' test-results.xml | head -1)
          FAILURES=$(grep -oP 'failures="\K[0-9]+' test-results.xml | head -1)

          if [ "$FAILURES" = "0" ]; then
            echo "BADGE_COLOR=brightgreen" >> "$GITHUB_ENV"
          else
            echo "BADGE_COLOR=red" >> "$GITHUB_ENV"
          fi

          echo "TEST_COUNT=${TESTS}" >> "$GITHUB_ENV"

      # NOTE: To enable the test badge, you need to:
      # 1. Create a GitHub Gist and copy its ID
      # 2. Create a Personal Access Token (PAT) with gist scope
      # 3. Add the PAT as a repository secret named GIST_TOKEN
      # 4. Replace bde6a4c4930c19a963199fa0bea2b265 below with your actual Gist ID
      - name: Update test badge
        if: github.ref == 'refs/heads/master'
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_TOKEN }}
          gistID: bde6a4c4930c19a963199fa0bea2b265
          filename: onebun-test-badge.json
          label: tests
          message: ${{ env.TEST_COUNT }} passed
          color: ${{ env.BADGE_COLOR }}

      # Publish-specific validation (lockfile, secret scan, change detection,
      # workspace-dependency rewriting) on the PR that causes a problem, instead of for
      # the first time after the merge button, mid-release. --skip-suite drops the
      # test/typecheck/lint gates, which are this job's own steps above.
      - name: Publish dry run
        if: github.event_name == 'pull_request'
        run: bun scripts/publish.ts --dry-run --skip-suite

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}  # Optional for public repos, but recommended
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Publish packages
        # Publish only on push to master or manual trigger (not on PRs)
        if: (github.event_name == 'push' && github.ref == 'refs/heads/master') || github.event_name == 'workflow_dispatch'
        run: bun run publish:packages
